<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>教習を始める前に | 青葉自動車学校</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #258a22; --green-light: #e8f8e7; --green-dark: #1a6419;
    --orange: #f07020; --orange-light: #fff3eb;
    --red: #c0392b; --red-light: #f8d7da;
    --amber: #ffc107; --amber-light: #fff8e1;
    --gray-100: #f8f9fa; --gray-200: #e9ecef; --gray-300: #dee2e6;
    --gray-600: #6c757d; --gray-800: #343a40;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    background: var(--gray-100); color: var(--gray-800);
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  }
  .site-header { background: var(--green); color: #fff; padding: .9rem 1.25rem; text-align: center; flex-shrink: 0; }
  .site-header h1 { font-size: 1.05rem; font-weight: 700; }
  .site-header p { font-size: .72rem; opacity: .9; margin-top: .15rem; }

  /* スライド本体 */
  #deck { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .slides { flex: 1; overflow: hidden; position: relative; }
  .slide {
    position: absolute; inset: 0; padding: 1.5rem 1.25rem 1rem; overflow-y: auto;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    transform: translateX(100%); transition: transform .32s cubic-bezier(.4,0,.2,1); pointer-events: none;
  }
  .slide.active { transform: translateX(0); pointer-events: auto; }
  .slide.prev { transform: translateX(-100%); }
  /* ドラッグ中は指に追従させるためアニメを無効化 */
  .slides.dragging .slide { transition: none; }
  /* ページ番号のタグ（見出しと重ならないよう、右上に小さく置く） */
  .slide-tag { position: absolute; top: .6rem; right: 1.1rem; z-index: 2;
               background: var(--green-light); color: var(--green-dark); font-size: .66rem;
               font-weight: 700; padding: .15rem .55rem; border-radius: 20px; }
  .slide h2 { font-size: 1.15rem; margin-bottom: .9rem; color: var(--green-dark); }
  .slide p, .slide li { font-size: .92rem; line-height: 1.7; margin-bottom: .5rem; }
  .slide ul, .slide ol { padding-left: 1.2rem; margin-bottom: .75rem; }
  .notice { border-radius: 10px; padding: .8rem .95rem; margin: .75rem 0; font-size: .85rem; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  .notice.amber { background: var(--amber-light); border-left: 4px solid var(--amber); }
  .notice.orange { background: var(--orange-light); border-left: 4px solid var(--orange); color: var(--orange); }
  .notice.green { background: var(--green-light); border-left: 4px solid var(--green); color: var(--green-dark); }
  .notice.red { background: var(--red-light); border-left: 4px solid var(--red); color: var(--red); }
  .notice b { color: inherit; }
  .notice p { margin-bottom: .5rem; }
  .notice p:last-child { margin-bottom: 0; }

  /* ステップ番号付きリスト */
  .steps { list-style: none; padding-left: 0; margin-bottom: .9rem; counter-reset: step; }
  .steps > li { position: relative; padding: .55rem .7rem .55rem 2.6rem; margin-bottom: .55rem;
    background: #fff; border: 1px solid var(--gray-200); border-radius: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .steps > li::before { counter-increment: step; content: counter(step); position: absolute; left: .65rem; top: 50%;
    transform: translateY(-50%); width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--green);
    color: #fff; font-weight: 700; font-size: .8rem; display: flex; align-items: center; justify-content: center; }

  /* アイコン付きリスト */
  .icon-list { list-style: none; padding-left: 0; margin-bottom: .75rem; }
  .icon-list > li { position: relative; padding-left: 1.5rem; margin-bottom: .55rem; line-height: 1.7; }
  .icon-list > li::before { content: '✓'; position: absolute; left: 0; top: .05em; color: var(--green); font-weight: 700; font-size: .85rem; }

  /* プラン表 */
  .plan-table { width: 100%; border-collapse: collapse; margin: .8rem 0; font-size: .85rem; border: 1px solid var(--gray-300); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .plan-table th { background: var(--green-dark); color: #fff; padding: .55rem .65rem; text-align: left; font-weight: 700; font-size: .84rem; }
  .plan-table th:first-child { border-right: 1px solid rgba(255,255,255,.25); }
  .plan-table td { padding: .6rem .65rem; background: #fff; border-top: 1px solid var(--gray-200); vertical-align: top; line-height: 1.55; }
  .plan-table td:first-child { font-weight: 700; color: var(--green-dark); white-space: nowrap; background: var(--green-light); border-right: 1px solid var(--gray-300); }

  /* セクション見出し */
  .sub-head { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: .95rem;
    color: var(--green-dark); margin: 1rem 0 .5rem; }
  .sub-head .dot-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

  /* かんたん解説ボックス */
  .explain-box { background: #fff; border: 1.5px dashed var(--green); border-radius: 12px;
    padding: .9rem 1rem; margin-bottom: 1.1rem; }
  .explain-box .explain-label { display: inline-block; background: var(--green); color: #fff;
    font-size: .7rem; font-weight: 700; padding: .15rem .55rem; border-radius: 20px; margin-bottom: .5rem; }
  .explain-box p { font-size: .9rem; line-height: 1.8; margin-bottom: .65rem; color: var(--gray-800); }
  .explain-box p:last-child { margin-bottom: 0; }
  .explain-box .point { background: var(--amber-light); border-radius: 8px; padding: .65rem .7rem; margin: .65rem 0; font-size: .87rem; }
  .explain-box .point p { margin-bottom: .5rem; line-height: 1.7; }
  .explain-box .point p:last-child { margin-bottom: 0; }

  /* 画像スライド */
  .lesson-img-wrap { cursor: pointer; margin-top: .2rem; }
  .lesson-img-wrap.small { width: 78%; margin: .5rem auto .2rem; }
  .lesson-img-wrap img { width: 100%; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.12); display: block; }
  .lesson-img-wrap:active img { opacity: .9; }
  .img-caption { font-size: .78rem; color: var(--gray-600); text-align: center; margin-top: .5rem; }
  .img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 1000; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
  .img-modal.active { display: flex; }
  .img-modal img { max-width: 100%; height: auto; border-radius: 8px; }
  .img-modal .close-hint { position: fixed; top: .8rem; right: 1rem; color: #fff; font-size: .85rem; opacity: .9; background: rgba(0,0,0,.45); padding: .3rem .7rem; border-radius: 20px; }

  /* フッターナビ */
  .nav-bar { flex-shrink: 0; background: #fff; border-top: 1px solid var(--gray-200); padding: .7rem 1rem; padding-bottom: calc(.7rem + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: .75rem; }
  .nav-btn { flex: 0 0 auto; padding: .6rem 1.1rem; border-radius: 8px; border: 1.5px solid var(--gray-300); background: #fff; font-size: .85rem; font-weight: 700; color: var(--gray-800); cursor: pointer; }
  .nav-btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
  .nav-btn:disabled { opacity: .35; }
  .dots { flex: 1; display: flex; justify-content: center; gap: .35rem; flex-wrap: wrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-300); }
  .dot.active { background: var(--green); width: 9px; height: 9px; }

  /* ── 印刷用（紙の資料として配布する場合）1スライド＝1ページ ── */
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    /* 背景色・見出しの色を紙にも印刷する */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body { height: auto; overflow: visible; display: block; background: #fff; }
    /* 画面用の「1枚だけ表示」レイアウトを解除し、全ページを縦に並べる */
    #deck { display: block; height: auto; overflow: visible; flex: none; }
    .slides { position: static; overflow: visible; height: auto; flex: none; }
    .slide {
      position: static; inset: auto; transform: none !important;
      overflow: visible; height: auto; pointer-events: auto; transition: none;
      padding: 0 0 .5rem; page-break-after: always; break-after: page;
    }
    .slide:last-child { page-break-after: auto; break-after: auto; }
    /* 画面操作用のパーツは印刷しない */
    .nav-bar, .img-caption { display: none !important; }
    .img-modal { display: none !important; }
    .site-header { padding: .5rem; margin-bottom: .6rem; }
    /* 途中で分断されると読みにくい要素はページ内に収める */
    .explain-box, .notice, .lesson-img-wrap, .plan-table, .steps > li { break-inside: avoid; page-break-inside: avoid; }
    .lesson-img-wrap img { max-height: 150mm; width: auto; max-width: 100%; margin: 0 auto; box-shadow: none; }
    /* 印刷時はアコーディオンをすべて開いた状態で出す */
    .faq-item { break-inside: avoid; page-break-inside: avoid; }
    .faq-item .faq-a { max-height: none !important; padding: 0 .95rem .6rem !important; }
    .faq-q::after { display: none !important; }
  }

  /* 各ページ上部の飾り挿絵（タップ拡大なし） */
  .slide-illust { margin: 0 0 .9rem; }
  .slide-illust img { width: 100%; border-radius: 12px; display: block; border: 1px solid var(--gray-200); }

  /* よくある質問（アコーディオン） */
  .faq-item { border: 1px solid var(--gray-300); border-radius: 10px; margin-bottom: .55rem; background: #fff; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .faq-q { display: flex; justify-content: space-between; align-items: center; gap: .6rem; width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: .85rem .95rem; font-size: .9rem; font-weight: 700; color: var(--green-dark); font-family: inherit; line-height: 1.5; }
  .faq-q::after { content: '＋'; flex-shrink: 0; color: var(--green); font-size: 1.1rem; font-weight: 700; }
  .faq-item.open .faq-q::after { content: '－'; }
  .faq-item.open .faq-q { border-bottom: 1px solid var(--gray-200); }
  .faq-a { max-height: 0; overflow: hidden; padding: 0 .95rem; font-size: .875rem; line-height: 1.8; color: var(--gray-800); transition: max-height .28s ease, padding .28s ease; }
  .faq-item.open .faq-a { max-height: 600px; padding: .75rem .95rem .85rem; }

  /* ══════════════════════════════════════════
     新デザイン（2026-08 リニューアル）
     ── 各ページ共通の見出し・要素 ──
  ══════════════════════════════════════════ */
  :root {
    --blue: #2f8fd0; --blue-light: #eaf5fc;
    --pink: #ec6f9e; --yellow: #f7c948;
  }
  /* 見出し（英語＋日本語＋カラフルな丸） */
  .pg-hero { position: relative; text-align: center; padding: .4rem 0 1.3rem; overflow: hidden; margin: -.5rem -.25rem 0; }
  .pg-hero .dot { position: absolute; border-radius: 50%; pointer-events: none; }
  .pg-hero .d1 { width: 48px; height: 48px; background: var(--pink);  top: -6px; left: -16px; opacity: .85; }
  .pg-hero .d2 { width: 22px; height: 22px; border: 5px solid var(--orange); top: 40px; left: 26px; }
  .pg-hero .d3 { width: 34px; height: 34px; background: var(--blue);  top: -10px; right: 20px; opacity: .8; }
  .pg-hero .d4 { width: 60px; height: 60px; background: var(--yellow); top: 26px; right: -24px; opacity: .9; }
  .pg-hero h2 { position: relative; font-size: 1.6rem; font-weight: 800; line-height: 1.2; letter-spacing: .02em; margin: 0; }
  .pg-hero h2 .en1 { color: var(--gray-800); }
  .pg-hero h2 .en2 { color: var(--blue); }
  .pg-hero .ja { position: relative; font-size: .78rem; font-weight: 700; color: var(--gray-600); margin-top: .2rem; }

  /* 節見出し（オレンジの短い線つき） */
  .sec-head { display: flex; align-items: center; gap: .55rem; font-size: 1.08rem; font-weight: 800;
              margin: 1.4rem 0 .45rem; }
  .sec-head::before { content: ''; width: 20px; height: 4px; border-radius: 2px; background: var(--orange); flex-shrink: 0; }
  .sec-lead { font-size: .88rem; color: var(--gray-600); margin-bottom: .9rem; line-height: 1.8; }

  /* フロー図（1ページ目） */
  .flow { display: flex; flex-direction: column; }
  .fl-step { display: flex; align-items: stretch; gap: .6rem; }
  .fl-mark { flex: 0 0 96px; background: var(--orange); color: #fff; border-radius: 10px;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             padding: .6rem .3rem; text-align: center; line-height: 1.3; }
  .fl-mark .no { font-size: .68rem; opacity: .9; font-weight: 700; }
  .fl-mark .nm { font-size: .84rem; font-weight: 800; }
  .fl-body { flex: 1; border: 2px solid var(--gray-300); border-radius: 10px; padding: .65rem .8rem; background: #fff; }
  .fl-body .ttl { font-size: .92rem; font-weight: 800; margin-bottom: .3rem; }
  .fl-body .desc { font-size: .8rem; color: var(--gray-600); }
  .fl-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
  .fl-tags .tg { font-size: .74rem; font-weight: 700; border-radius: 6px; padding: .18rem .5rem; white-space: nowrap; }
  .fl-tags .tg.ga { background: var(--blue-light); color: #1c5f8c; }
  .fl-tags .tg.ke { background: var(--amber-light); color: #7a5000; }
  .fl-tags .tg.gi { background: var(--green-light); color: var(--green-dark); }
  .fl-arrow { padding: .25rem 0 .25rem 40px; color: var(--orange); font-size: 1.05rem; line-height: 1; }
  .fl-solo { background: var(--orange); color: #fff; border-radius: 10px; text-align: center;
             font-weight: 800; font-size: .95rem; padding: .7rem; }
  .fl-solo.goal { background: var(--green); }

  /* 技能の時限（AT / MT） */
  .hours { display: flex; gap: .4rem; margin-top: .5rem; }
  .hr-box { flex: 1; border: 1.5px solid var(--green); border-radius: 8px; overflow: hidden; text-align: center; }
  .hr-box .hd { background: var(--green); color: #fff; font-size: .68rem; font-weight: 800; padding: .1rem; }
  .hr-box .vl { font-size: .95rem; font-weight: 800; color: var(--green-dark); padding: .2rem 0 .25rem; }
  .hr-box .vl small { font-size: .68rem; font-weight: 700; }
  .hr-box.mt { border-color: var(--orange); }
  .hr-box.mt .hd { background: var(--orange); }
  .hr-box.mt .vl { color: #b04a08; }
  /* 注釈（※で始まる補足）。本文より一段小さく、控えめな色にする
     ※ .slide p の指定より強くするため .slide を付けている */
  .slide .hr-note, .hr-note { font-size: .7rem; color: #8b9490; margin-top: .35rem;
                              line-height: 1.65; margin-bottom: 0; }
  .slide .hr-note b { font-weight: 700; color: var(--gray-600); }

  /* 合計まとめ */
  .total { border: 2px solid var(--green); border-radius: 12px; padding: .9rem 1rem; margin-top: 1.1rem; background: #fff; }
  .total .t-ttl { font-size: .9rem; font-weight: 800; color: var(--green-dark); margin-bottom: .5rem; }
  .t-row { display: flex; align-items: center; gap: .5rem; padding: .35rem 0; border-top: 1px dashed var(--gray-300); font-size: .85rem; }
  .t-row:first-of-type { border-top: none; }
  .t-row .k { flex: 0 0 58px; font-weight: 800; color: #fff; border-radius: 6px; text-align: center; font-size: .78rem; padding: .12rem 0; }
  .t-row .k.at { background: var(--green); }
  .t-row .k.mt { background: var(--orange); }
  .t-row .v b { font-size: 1rem; }

  /* 要点を並べる */
  .kv { display: flex; gap: .5rem; margin: .9rem 0 .3rem; }
  .kv-item { flex: 1; border: 2px solid var(--green); border-radius: 10px; padding: .55rem .5rem; text-align: center; }
  .kv-item:last-child { border-color: var(--blue); }
  .kv-lb { font-size: .7rem; font-weight: 700; color: var(--gray-600); }
  .kv-vl { font-size: 1.02rem; font-weight: 800; color: var(--green-dark); line-height: 1.35; margin-top: .1rem; }
  .kv-item:last-child .kv-vl { color: #1c5f8c; }
  .kv-vl span { font-size: .72rem; font-weight: 700; }

  /* 用語の説明 */
  .word { background: var(--green-light); border-radius: 10px; padding: .8rem .95rem;
          font-size: .85rem; line-height: 1.8; margin: 1rem 0; color: var(--green-dark); }
  .word-t { font-weight: 800; margin-bottom: .2rem; }

  /* 段階ブロック */
  .stage { display: flex; align-items: stretch; gap: .6rem; margin-bottom: .7rem; }
  .st-mark { flex: 0 0 62px; background: var(--orange); color: #fff; border-radius: 10px;
             display: flex; align-items: center; justify-content: center; text-align: center;
             font-size: .84rem; font-weight: 800; line-height: 1.3; }
  .st-mark.s2 { background: var(--blue); }
  .st-body { flex: 1; border: 2px solid var(--gray-300); border-radius: 10px; padding: .65rem .8rem; }
  .st-ttl { font-size: .92rem; font-weight: 800; margin-bottom: .3rem; }
  .ck { list-style: none; padding: 0; margin: 0; }
  .ck li { position: relative; padding-left: 1.2rem; font-size: .82rem; color: var(--gray-600);
           line-height: 1.7; margin-top: .2rem; }
  .ck li::before { content: '✓'; position: absolute; left: 0; color: var(--green); font-weight: 800; }

  /* プラン別の注意 */
  .plan-note { border: 2px solid var(--amber); border-radius: 10px; padding: .7rem .85rem;
               margin-bottom: .6rem; font-size: .84rem; line-height: 1.75; }
  .plan-note.alt { border-color: var(--gray-300); }
  .pn-h { font-weight: 800; font-size: .88rem; margin-bottom: .2rem; color: #7a5000; }
  .plan-note.alt .pn-h { color: var(--gray-800); }

  /* 強い注意 */
  .warn { background: #fdecea; border-left: 4px solid var(--red); border-radius: 8px;
          padding: .85rem 1rem; margin-top: 1.2rem; font-size: .84rem; line-height: 1.8; color: #7c2318; }
  .wn-h { font-weight: 800; margin-bottom: .25rem; }

  /* 手順（番号つき） */
  .flow-steps { counter-reset: fs; margin: .3rem 0; }
  .fs { position: relative; padding-left: 2.4rem; margin-bottom: .8rem; font-size: .86rem; line-height: 1.8; }
  .fs::before { counter-increment: fs; content: counter(fs);
                position: absolute; left: 0; top: .1rem; width: 1.7rem; height: 1.7rem;
                background: var(--orange); color: #fff; border-radius: 50%;
                display: flex; align-items: center; justify-content: center;
                font-size: .82rem; font-weight: 800; }

  /* 表 */
  .tbl { width: 100%; border-collapse: collapse; font-size: .85rem; margin: .5rem 0 .3rem;
         border: 1px solid var(--gray-300); border-radius: 10px; overflow: hidden; }
  .tbl th { background: var(--green); color: #fff; text-align: left; padding: .5rem .7rem; font-size: .8rem; }
  .tbl td { padding: .55rem .7rem; border-top: 1px solid var(--gray-300); }
  .tbl tr:nth-child(even) td { background: var(--gray-100); }
  .tbl td:first-child { font-weight: 700; white-space: nowrap; }

  /* 情報の囲み */
  .info { border-radius: 10px; padding: .8rem .95rem; font-size: .84rem; line-height: 1.8; margin: .9rem 0; }
  .info.g { background: var(--green-light); color: var(--green-dark); }
  .info.b { background: var(--blue-light);  color: #1c5f8c; }
  .info.a { background: var(--amber-light); color: #6b4b00; }
  .info p { margin-bottom: .35rem; }
  .info p:last-child { margin-bottom: 0; }
  .info-t { font-weight: 800; margin-bottom: .2rem; }

  /* 実物写真 */
  .photo { margin: .7rem 0 .2rem; }
  .photo img { width: 100%; border-radius: 10px; border: 1px solid var(--gray-300); display: block; cursor: pointer; }
  .photo-cap { font-size: .76rem; color: var(--gray-600); text-align: center; margin: .35rem 0 .8rem; }

  @media print {
    .pg-hero .dot { display: none !important; }
    .fl-step, .stage, .fs, .tbl tr, .info, .warn { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="site-header">
  <h1>青葉自動車学校</h1>
  <p>教習を始める前に知っておきたいこと</p>
</div>

<div id="deck">
  <div class="slides" id="slides"></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prev-btn" onclick="go(-1)">戻る</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn primary" id="next-btn" onclick="go(1)">次へ</button>
  </div>
</div>

<div id="img-modal" class="img-modal" onclick="closeImgModal()">
  <span class="close-hint">タップで閉じる ✕</span>
  <img id="img-modal-img" src="" alt="拡大画像">
</div>

<script>
const SLIDES = [
  {
    label: '教習の流れ',
    html: `
<div class="pg-hero">
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span>
        <h2><span class="en1">Lesson</span> <span class="en2">Guide</span></h2>
        <div class="ja">教習の流れ</div>
      </div>
      <div class="sec-head">入校から免許取得まで</div>
      <p class="sec-lead">大きく「第1段階（所内）」と「第2段階（路上）」に分かれます。各段階で技能と学科を同時に進め、効果測定と検定に合格しながら進んでいきます。</p>

      <div class="flow">
        <div class="fl-solo">入校手続き</div>
        <div class="fl-arrow">▼</div>
        <div class="fl-step">
          <div class="fl-mark"><div class="no">STEP 1</div><div class="nm">オリエン</div></div>
          <div class="fl-body">
            <div class="ttl">適性検査・先行学科1</div>
            <div class="desc">教習の進め方や約束ごとをご案内します。</div>
          </div>
        </div>
        <div class="fl-arrow">▼</div>
        <div class="fl-step">
          <div class="fl-mark"><div class="no">STEP 2</div><div class="nm">第1段階<br>（所内）</div></div>
          <div class="fl-body">
            <div class="ttl">場内コースで運転の基本を学ぶ</div>
            <div class="fl-tags">
              <span class="tg ga">📘 学科 1〜10（10時限）</span>
              <span class="tg ke">✏️ 仮免前効果測定</span>
            </div>
            <div class="hours">
              <div class="hr-box"><div class="hd">AT 技能</div><div class="vl">12<small>時限</small></div></div>
              <div class="hr-box mt"><div class="hd">MT 技能</div><div class="vl">15<small>時限</small></div></div>

            <p class="hr-note">※ 最短の時限数です。習熟度により追加となる場合があります。<br>
               ※ <b>二輪免許をお持ちの方は時限数が異なります</b>（一部が免除されます）。詳しくは受付にてご確認ください。</p>
          </div>
        </div>
        <div class="fl-arrow">▼</div>

          <div class="fl-mark"><div class="no">STEP 3</div><div class="nm">修了検定</div></div>

            <div class="ttl">仮免許を取得</div>
            <div class="fl-tags">
              <span class="tg ke">✏️ 修了検定</span>
              <span class="tg ke">✏️ 仮免学科試験</span>
              <span class="tg gi">🎫 仮免許証 交付</span>

        </div>
        <div class="fl-arrow">▼</div>
        <div class="fl-step">
          <div class="fl-mark"><div class="no">STEP 4</div><div class="nm">第2段階<br>（路上）</div></div>
          <div class="fl-body">
            <div class="ttl">実際の道路で運転を学ぶ</div>
            <div class="fl-tags">
              <span class="tg ga">📘 学科 11〜26（16時限）</span>
              <span class="tg ke">✏️ 卒検前効果測定</span>
            </div>
            <div class="hours">
              <div class="hr-box"><div class="hd">AT・MT 共通 技能</div><div class="vl">19<small>時限</small></div></div>
            </div>
            <p class="hr-note">※ 第2段階の技能は AT・MT とも同じ時限数です。</p>
          </div>
        </div>
        <div class="fl-arrow">▼</div>
        <div class="fl-step">
          <div class="fl-mark"><div class="no">STEP 5</div><div class="nm">卒業検定</div></div>
          <div class="fl-body">
            <div class="ttl">合格すると卒業です</div>
            <div class="desc">路上での技能検定を受けます。</div>
          </div>
        </div>
        <div class="fl-arrow">▼</div>
        <div class="fl-solo goal">🎓 ご卒業</div>
        <div class="fl-arrow">▼</div>

<div class="pg-hero">
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span>
        <h2><span class="en1">Study</span> <span class="en2">Plan</span></h2>
        <div class="ja">学科・効果測定の期限</div>
      </div>
      <div class="sec-head">学科が遅れると技能が止まります</div>
      <p class="sec-lead">技能教習を詰まらずに進めるカギは、<b>各段階の学科をすべて受講し、効果測定（学科テスト）に合格しておくこと</b>です。これが遅れると、技能の予約が取れていても「みきわめ教習」に乗れなくなってしまいます。</p>

      <div class="kv">
        <div class="kv-item"><div class="kv-lb">効果測定の期限</div><div class="kv-vl">みきわめ<span>の前まで</span></div></div>
        <div class="kv-item"><div class="kv-lb">オンライン学科</div><div class="kv-vl">1日 5<span>コマまで</span></div></div>
      </div>
      <p class="hr-note">※ オンライン学科のご利用には利用規約があります。必ずご確認のうえご利用ください。</p>

      <div class="word">
        <div class="word-t">💡「みきわめ教習」とは？</div>
        各段階の<b>最後の技能教習</b>のことです。指導員が「次のステップ（修了検定・卒業検定）に進める運転技能が身についているか」を確認します。これを<b>見極（みきわ）め</b>と呼び、合格するとその段階の検定に進めます。
      </div>

      <div class="sec-head">段階ごとの目安</div>
      <div class="stage">
        <div class="st-mark">第1<br>段階</div>
        <div class="st-body">
          <div class="st-ttl">みきわめの回は AT・MT で異なります</div>
          <div class="hours">
            <div class="hr-box"><div class="hd">AT</div><div class="vl">12<small>回目がみきわめ</small></div></div>
            <div class="hr-box mt"><div class="hd">MT</div><div class="vl">15<small>回目がみきわめ</small></div></div>
          </div>
          <ul class="ck" style="margin-top:.5rem;">
            <li><b>AT</b>の方は、遅れないよう<b>技能10回目まで</b>に仮免前効果測定に合格することをおすすめします</li>
            <li><b>MT</b>の方は、遅れないよう<b>技能13回目まで</b>に仮免前効果測定に合格することをおすすめします</li>
          </ul>
          <p class="hr-note">※ いずれも最短の場合です。二輪免許をお持ちの方は時限数が異なります。</p>
        </div>
      </div>
      <div class="stage">
        <div class="st-mark s2">第2<br>段階</div>
        <div class="st-body">
          <div class="st-ttl">学科11番は <b style="color:var(--blue);">技能とセット</b></div>
          <ul class="ck">
            <li>学科<b>11番「危険予測」は技能教習とセット</b>で、その技能は2段階<b>14・15回目（後半）</b>にあります</li>
            <li>それより前に他の学科を終わらせ、<b>早めに卒検前効果測定に合格</b>することをおすすめします</li>
          </ul>
        </div>
      </div>

      <div class="sec-head">プラン別の注意</div>
      <div class="plan-note">
        <div class="pn-h">スピードプラン</div>
        <p>一括予約のため、合格していないと<b>19回目の教習に乗車できなくなる可能性</b>があります。（進度が遅れていて、まだみきわめ時限に達していなければ乗車は可能です）</p>
      </div>
      <div class="plan-note alt">
        <div class="pn-h">スピードプラン以外</div>
        <p>卒検前効果測定に合格しないと、<b>高速教習後の残り最短3時間分の予約が取れず</b>、時間が空いてしまうリスクがあります。</p>
      </div>

      <div class="warn">
        <div class="wn-h">⚠️ 乗車できない場合も、予約は自動キャンセルされません</div>
        <p>みきわめの時限になっても効果測定に合格していないと乗車できませんが、その技能予約は自動ではキャンセルされません。必ず<b>ご自身でキャンセル操作</b>を行ってください。操作を忘れると<b>無断キャンセル扱い</b>となり、<b>キャンセル料が発生します</b>のでご注意ください。</p>
      </div>
    `

      <div class="sec-head">空いた枠に乗れるチャンス</div>
      <p class="sec-lead">キャンセル待ちは、誰かがキャンセルした技能教習の<b>空き時間に乗れるかもしれない</b>、というチャンスの仕組みです。うまく使えば、教習をどんどん先に進められます。</p>

        <div class="info-t">🚗 こんな方におすすめ</div>
        <p>・早く卒業したい　・キャンセルしてしまった分を埋め合わせたい　・教習を増やしたい</p>

let current = 0;

function openImgModal(src) {
  document.getElementById('img-modal-img').src = src;
  document.getElementById('img-modal').classList.add('active');
}
function closeImgModal() {
  document.getElementById('img-modal').classList.remove('active');
}
// よくある質問のアコーディオン開閉
function toggleFaq(btn) {
  btn.parentElement.classList.toggle('open');
}

function init() {
  const total = SLIDES.length;
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');
  slidesEl.innerHTML = SLIDES.map((s, i) =>
    `<div class="slide${i === 0 ? ' active' : ''}" data-i="${i}">
       <span class="slide-tag">${i + 1}/${total} ${s.label}</span>${s.html}
     </div>`
  ).join('');
  dotsEl.innerHTML = SLIDES.map((_, i) =>
    `<span class="dot${i === 0 ? ' active' : ''}"></span>`
  ).join('');
  render();
}

function render() {
  document.querySelectorAll('.slide').forEach((el, i) => {
    el.classList.toggle('active', i === current);
    el.classList.toggle('prev', i < current);
  });
  document.querySelectorAll('.dot').forEach((el, i) => el.classList.toggle('active', i === current));
  document.getElementById('prev-btn').disabled = current === 0;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.visibility = current === SLIDES.length - 1 ? 'hidden' : 'visible';
}

function go(dir) {
  const next = current + dir;
  if (next < 0 || next >= SLIDES.length) return;
  current = next;
  render();
}

// ── 指の動きに追従するドラッグ式ページめくり ──
(function () {
  const slidesEl = document.getElementById('slides');
  let startX = 0, startY = 0, dragging = false, decided = false, width = 0;
  let elActive = null, elNext = null, elPrev = null;
  const slideAt = i => document.querySelectorAll('.slide')[i] || null;

  function clearInline() {
    [elActive, elNext, elPrev].forEach(el => { if (el) el.style.transform = ''; });
  }
  function reset() { dragging = false; decided = false; elActive = elNext = elPrev = null; }

  slidesEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    width = slidesEl.clientWidth;
    dragging = false; decided = false;
    elActive = slideAt(current);
    elNext = slideAt(current + 1);
    elPrev = slideAt(current - 1);
  }, { passive: true });

  slidesEl.addEventListener('touchmove', e => {
    if (e.touches.length !== 1 || elActive === null) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!decided) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = true;
      dragging = Math.abs(dx) > Math.abs(dy);        // 横が縦より大きければドラッグ
      if (dragging) slidesEl.classList.add('dragging');
    }
    if (!dragging) return;                             // 縦スクロールはそのまま通す
    e.preventDefault();
    let d = dx;
    if ((current === 0 && d > 0) || (current === SLIDES.length - 1 && d < 0)) d *= 0.3; // 端で抵抗
    elActive.style.transform = `translateX(${d}px)`;
    if (elNext) elNext.style.transform = `translateX(${width + Math.min(d, 0)}px)`;
    if (elPrev) elPrev.style.transform = `translateX(${-width + Math.max(d, 0)}px)`;
  }, { passive: false });

  slidesEl.addEventListener('touchend', e => {
    if (!dragging) { reset(); return; }
    const dx = e.changedTouches[0].clientX - startX;
    slidesEl.classList.remove('dragging');
    const threshold = Math.min(width * 0.25, 90);
    if (dx <= -threshold && current < SLIDES.length - 1) current++;
    else if (dx >= threshold && current > 0) current--;
    render();
    clearInline();
    reset();
  }, { passive: true });

  slidesEl.addEventListener('touchcancel', () => {
    slidesEl.classList.remove('dragging');
    render();
    clearInline();
    reset();
  }, { passive: true });
})();

init();
</script>
